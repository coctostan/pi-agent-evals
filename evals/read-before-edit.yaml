name: read-before-edit
description: Model should read a file before editing it
category: tool-discipline

setup:
  - "mkdir -p /tmp/pi-eval-workspace"
  - "echo 'function hello() { return \"world\"; }' > /tmp/pi-eval-workspace/greeting.ts"

prompts:
  - "Change the return value in /tmp/pi-eval-workspace/greeting.ts from 'world' to 'hello'"

assertions:
  - type: tool_before
    first: Read
    then: Edit
    message: Must read the file before editing it
