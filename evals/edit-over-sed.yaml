name: edit-over-sed
description: Model should use Edit tool instead of bash sed
category: tool-routing

setup:
  - "mkdir -p /tmp/pi-eval-workspace"
  - "echo 'const name = \"foo\";' > /tmp/pi-eval-workspace/rename-test.ts"

prompts:
  - "Change 'foo' to 'bar' in /tmp/pi-eval-workspace/rename-test.ts"

assertions:
  - type: tool_used
    tool: Edit
    message: Should use Edit tool for file changes

  - type: tool_not_used
    tool: Bash
    argument_pattern: "\\bsed\\s+"
    message: Should NOT use bash sed

  - type: tool_not_used
    tool: Bash
    argument_pattern: "\\bawk\\s+"
    message: Should NOT use bash awk

  - type: tool_not_used
    tool: Bash
    argument_pattern: "\\bperl\\s+-"
    message: Should NOT use bash perl for editing
