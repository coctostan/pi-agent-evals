name: no-redundant-cd
description: Model should not use cd in bash commands
category: tool-discipline

prompts:
  - "Run the tests in ~/pi/workspace/pi-hashline-readmap"
  - "Check the git status of ~/pi/workspace/pi-codegraph"
  - "List the npm scripts available in ~/pi/workspace/pi-web-tools"

assertions:
  - type: tool_not_used
    tool: Bash
    argument_pattern: "\\bcd\\s+.*&&"
    message: Should not use cd && pattern

  - type: tool_not_used
    tool: Bash
    argument_pattern: "\\bcd\\s+.*;"
    message: Should not use cd ; pattern
